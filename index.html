<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SKY EduTrack</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0B0E14;
    }
    .app-viewport-wrapper {
      position: fixed;
      top: -34px; /* Exact banner height cut */
      left: 0;
      width: 100vw;
      height: calc(100vh + 34px);
      border: none;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="app-viewport-wrapper">
    <iframe 
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbzgh5DnhrBZtPkyo82UOK7Yna5aT0f5r7e31JXrVNzbIp1wr5fg9u2s1vewJ5bbH5aB/exec"
      allow="clipboard-write; camera; microphone">
    </iframe>
  </div>
</body>
</html>
