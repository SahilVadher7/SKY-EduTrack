<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SKY EduTrack</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Web App Manifest (PWA & Desktop App Installation) -->
  <link rel="manifest" href="manifest.json">

  <!-- Mobile & Desktop App Icons -->
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SKY EduTrack">
  <meta name="theme-color" content="#0B0E14">

  <!-- Early DNS Prefetch & TLS Handshake Preconnections -->
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">
  <link rel="dns-prefetch" href="https://lh3.googleusercontent.com">
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0B0E14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .app-viewport-wrapper {
      position: fixed;
      top: -34px; /* Eliminates Google Apps Script top banner */
      left: 0;
      width: 100vw;
      height: calc(100vh + 34px);
      border: none;
      overflow: hidden;
      z-index: 1;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      opacity: 0;
      transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    iframe.loaded {
      opacity: 1;
    }

    /* Branded Zero-Dependency Dark Skeleton */
    #skeletonLoader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0B0E14;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      z-index: 9999;
      pointer-events: none;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    #skeletonLoader.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .sk-pulse {
      background: linear-gradient(90deg, #151921 25%, #1E232E 50%, #151921 75%);
      background-size: 200% 100%;
      animation: skPulseAnim 1.6s infinite ease-in-out;
      border-radius: 8px;
    }
    @keyframes skPulseAnim {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .sk-header {
      width: 140px;
      height: 70px;
      margin-top: 18px;
      margin-bottom: 24px;
      border-radius: 12px;
    }
    .sk-nav {
      width: 100%;
      max-width: 680px;
      height: 44px;
      margin-bottom: 20px;
      border-radius: 10px;
    }
    .sk-hero {
      width: 100%;
      max-width: 680px;
      height: 190px;
      margin-bottom: 16px;
      border-radius: 12px;
    }
    .sk-card {
      width: 100%;
      max-width: 680px;
      height: 140px;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <!-- Instant Brand Skeleton Shell -->
  <div id="skeletonLoader">
    <div class="sk-pulse sk-header"></div>
    <div class="sk-pulse sk-nav"></div>
    <div class="sk-pulse sk-hero"></div>
    <div class="sk-pulse sk-card"></div>
  </div>

  <div class="app-viewport-wrapper">
    <iframe 
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbzgh5DnhrBZtPkyo82UOK7Yna5aT0f5r7e31JXrVNzbIp1wr5fg9u2s1vewJ5bbH5aB/exec"
      allow="clipboard-write; camera; microphone"
      onload="dismissSkeleton()">
    </iframe>
  </div>

  <script>
    function dismissSkeleton() {
      var loader = document.getElementById('skeletonLoader');
      var frame = document.getElementById('appFrame');
      if (frame) frame.classList.add('loaded');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(function() {
          loader.style.display = 'none';
        }, 320);
      }
    }
    setTimeout(dismissSkeleton, 7000);
  </script>
</body>
</html>
